<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1eadc"><title>Quickfire Quiz</title><style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#1b2b29;background:#f1eadc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,650px)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:#50736c}.card{margin-top:18px;padding:clamp(24px,6vw,48px);background:#fffdf8;border-radius:24px;box-shadow:0 18px 60px #41301b14}.head{display:flex;justify-content:space-between;color:#66807a;font-size:14px}.bar{height:5px;background:#e8e5dc;border-radius:6px;margin:18px 0 36px;overflow:hidden}.bar span{display:block;height:100%;background:#e9774b;transition:width .25s}.q{font-size:clamp(25px,5vw,36px);line-height:1.12;letter-spacing:-.035em;margin:0 0 28px}.answers{display:grid;gap:10px}.answer{padding:16px;border:1px solid #d7ddd6;background:transparent;border-radius:12px;text-align:left;font:inherit;color:inherit;cursor:pointer}.answer:hover:not(:disabled){border-color:#50736c;background:#f1f7f4}.answer.correct{border-color:#378261;background:#e8f4ed}.answer.wrong{border-color:#c54f44;background:#fff0ec}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:14px}.hint{color:#768781;font-size:13px}.next{background:#1b2b29;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer}.next:disabled{opacity:.35;cursor:default}.restart{margin-top:14px;background:none;border:0;text-decoration:underline;color:#50736c;cursor:pointer;font:inherit}@media(max-width:480px){.card{border-radius:18px}.actions{align-items:flex-start;flex-direction:column}.next{width:100%}}
</style></head><body><main class="app"><div class="eyebrow">Quickfire / General knowledge</div><section class="card" id="card" aria-live="polite"></section></main><script>
const questions=[{q:'Which planet has the most moons confirmed in our solar system?',a:['Earth','Saturn','Mars','Venus'],correct:1},{q:'What does HTTP stand for?',a:['Hypertext Transfer Protocol','High Transfer Text Program','Hyperlink Terminal Transport Process','Host Text Transfer Path'],correct:0},{q:'Which artist painted The Starry Night?',a:['Claude Monet','Vincent van Gogh','Paul Cézanne','Edvard Munch'],correct:1},{q:'What is the chemical symbol for gold?',a:['Ag','Gd','Au','Go'],correct:2},{q:'Which data structure follows FIFO order?',a:['Stack','Tree','Queue','Graph'],correct:2}];let order=[],index=0,score=0,chosen=false;
function start(){order=questions.map((_,i)=>i).sort(()=>Math.random()-.5);index=0;score=0;render()}function render(){if(index>=order.length){document.querySelector('#card').innerHTML=`<div class="eyebrow">Round complete</div><h1 class="q">You scored ${score} / ${order.length}</h1><p>${score===order.length?'Perfect run. Nicely done.':'Good work. Every round is a fresh set.'}</p><button class="next" onclick="start()">Play again</button>`;return}chosen=false;const q=questions[order[index]];document.querySelector('#card').innerHTML=`<div class="head"><span>Question ${index+1} of ${order.length}</span><span>Score ${score}</span></div><div class="bar"><span style="width:${index/order.length*100}%"></span></div><h1 class="q">${q.q}</h1><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-i="${i}">${a}</button>`).join('')}</div><div class="actions"><span class="hint" id="hint">Choose one answer</span><button class="next" id="next" disabled>${index===order.length-1?'See score':'Next question'}</button></div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.querySelector('#next').onclick=()=>{index++;render()}}function $(s){return document.querySelector(s)}function answer(i){if(chosen)return;chosen=true;const q=questions[order[index]];document.querySelectorAll('.answer').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});if(i===q.correct)score++;$('#hint').textContent=i===q.correct?'Correct!':'Not quite, the highlighted answer is right.';$('#next').disabled=false}start();
</script></body></html>
